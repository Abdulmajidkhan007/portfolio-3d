    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Resolve the theme before the first paint. React sets the same attribute in
      <ThemeProvider>, but that only runs after hydration — without this the
      page would paint dark and then flip to light. Keep the logic identical to
      resolveInitialTheme() in src/theme/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <a href="#main" class="skip-link">Asosiy kontentga oʻtish</a>

    <!--
      Static first paint. Without it the page stays blank until React boots,
      which on a throttled connection is the whole first-contentful-paint
      budget. React's first commit replaces these children, and the markup is
      a deliberate visual match for <LoadingScreen> so the handover is
      invisible. Keep the two in sync if the intro is restyled.
    -->
    <div id="root">
