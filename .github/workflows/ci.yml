name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this covers typechecking
      # and catches anything that only breaks in a production bundle.
      - name: Build
        run: npm run build

      # The Cloud Function has its own package.json; the root build never
      # compiles it, so a type error there would only surface on deploy.
      - name: Typecheck functions
        working-directory: functions
        run: |
          npm ci
          npx tsc --noEmit -p .
